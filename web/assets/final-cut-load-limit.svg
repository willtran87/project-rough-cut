<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
 <title id="title">Nursery swale load-limit diagram</title>
 <desc id="desc">The irrigation bypass sends water into the nursery swale. Saturated turf gives way beneath heavy machinery. The raised stone service path stays above the water.</desc>
 <rect width="1000" height="660" fill="#ded3ae"/>
 <rect x="18" y="18" width="964" height="624" fill="none" stroke="#233d34" stroke-width="6"/>
 <g fill="#233d34" font-family="monospace" font-weight="bold" text-anchor="middle">
  <text x="500" y="79" font-size="40">NURSERY / LOAD LIMIT</text>
  <text x="500" y="126" font-size="27">KEEP HEAVY MACHINERY OFF SATURATED TURF</text>
 </g>
 <path d="M45 150H955" stroke="#233d34" stroke-width="4"/>
 <!-- The pump feeds low ground. The dry stone path is drawn above its level. -->
 <g stroke="#233d34" stroke-width="8" stroke-linejoin="round">
  <path d="M82 254H220V337H275" fill="none"/>
  <rect x="75" y="205" width="92" height="115" fill="#718576"/>
