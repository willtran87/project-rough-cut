  <path d="M735 310H925V435H735Z" fill="#a5a28a"/>
  <path d="M735 310H925M735 350H925M735 392H925M780 310V350M865 310V350M820 350V392M780 392V435M865 392V435" fill="none" stroke-width="4"/>
 </g>
 <!-- A heavy reel unit sinks at its wheels; no person is shown injured. -->
 <g transform="translate(476 285) rotate(8)" stroke="#233d34" stroke-width="8" stroke-linejoin="round">
  <path d="M-100 12H100V56H-100Z" fill="#ded3ae"/>
  <path d="M-40 12V-50H32L54 12" fill="#718576"/>
  <path d="M-21-33H17L29-3H-21Z" fill="#ded3ae" stroke-width="5"/>
