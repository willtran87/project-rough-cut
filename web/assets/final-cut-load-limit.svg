  <path d="M258 320L282 337L258 354" fill="none"/>
  <path d="M290 358H330L350 385H650L680 358H735V435H290Z" fill="#7a8060"/>
  <path d="M332 360H667L650 385H350Z" fill="#6b9791" stroke="none"/>
