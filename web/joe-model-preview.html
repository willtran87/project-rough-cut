<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joe — 3D character study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101c21;color:#ddd6bc;font:14px ui-monospace,monospace;overflow:hidden}canvas{display:block;touch-action:none}header{position:fixed;top:24px;left:28px;pointer-events:none}h1{font-size:20px;font-weight:500;margin:0 0 8px}p{color:#a1b2ae;max-width:440px;line-height:1.5;margin:0}footer{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;width:max-content;max-width:calc(100% - 24px);white-space:nowrap}button,a{font:inherit;color:#ddd6bc;border:1px solid #536960;background:#182b2c;padding:11px 14px;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#2c4240}button:focus-visible,a:focus-visible{outline:2px solid #e4b562;outline-offset:3px}#status{position:fixed;right:22px;top:26px;color:#a1b2ae}small{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);color:#a1b2ae;white-space:nowrap}@media(max-width:600px){small{display:none}header{left:16px;top:16px}h1{font-size:17px}p{max-width:270px;font-size:12px}#status{top:auto;bottom:123px;right:16px;font-size:11px}footer{bottom:18px;gap:5px}button,a{padding:10px;font-size:12px}}
</style>
<header><h1>JOE / CHARACTER STUDY</h1><p>Pixel materials on a real rigged model.<br>Drag to orbit · scroll or pinch to zoom.</p></header>
<div id="status">Loading model…</div><small>Local work in progress · actual game asset</small>
<footer><button id="motion">Pause walk</button><button id="turn">Turntable</button><button id="front">Front</button><button id="portrait">Face</button><a href="./">Play game</a></footer>
<script type="module">
import * as THREE from './vendor/three/three.module.js';
import {createJoeModel} from './joe-model.js';
import {prepareRendering} from './render-preparation.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#101c21');scene.fog=new THREE.Fog('#101c21',8,20);
const renderer=new THREE.WebGLRenderer({antialias:false});renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(42,1,.05,40);scene.add(new THREE.HemisphereLight(0xc1d7e0,0x495343,1.6));
const key=new THREE.DirectionalLight(0xf2dcc0,2.5);key.position.set(-3,5,-4);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-3;key.shadow.camera.right=3;key.shadow.camera.top=3;key.shadow.camera.bottom=-3;key.shadow.normalBias=.02;scene.add(key);
const rim=new THREE.DirectionalLight(0x87adaf,1.3);rim.position.set(3,3,3);scene.add(rim);
const ground=new THREE.Mesh(new THREE.CircleGeometry(10,64),new THREE.MeshLambertMaterial({color:0x233936}));ground.rotation.x=-Math.PI/2;ground.position.y=-.012;ground.receiveShadow=true;scene.add(ground);
const actor=createJoeModel(scene,()=>{},(asset,cancelled)=>prepareRendering(renderer,asset,camera,scene,null,cancelled)),position=new THREE.Vector3();let angle=-.5,elevation=.35,distance=3.7,walking=true,turn=false,portrait=false,travel=0,time=0,previous=performance.now();
const points=new Map();let pinch=0;
renderer.domElement.addEventListener('pointerdown',e=>{points.set(e.pointerId,[e.clientX,e.clientY]);renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;const old=points.get(e.pointerId);points.set(e.pointerId,[e.clientX,e.clientY]);if(points.size===1){angle-=(e.clientX-old[0])*.008;elevation=THREE.MathUtils.clamp(elevation+(e.clientY-old[1])*.004,-.05,1.1);}else{const [a,b]=[...points.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)distance=THREE.MathUtils.clamp(distance*pinch/d,2.1,6);pinch=d;}});
for(const name of ['pointerup','pointercancel'])renderer.domElement.addEventListener(name,e=>{points.delete(e.pointerId);pinch=0;});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();distance=THREE.MathUtils.clamp(distance+e.deltaY*.003,2.1,6);},{passive:false});
document.querySelector('#motion').onclick=e=>{walking=!walking;e.target.textContent=walking?'Pause walk':'Walk';};
document.querySelector('#turn').onclick=e=>{turn=!turn;e.target.textContent=turn?'Stop turntable':'Turntable';};
document.querySelector('#portrait').onclick=()=>{portrait=!portrait;angle=-.4;elevation=.1;distance=portrait?2.1:3.7;document.querySelector('#portrait').textContent=portrait?'Full body':'Face';};
document.querySelector('#front').onclick=()=>{portrait=false;document.querySelector('#portrait').textContent='Face';angle=0;elevation=.3;distance=3.7;turn=false;document.querySelector('#turn').textContent='Turntable';};
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}addEventListener('resize',resize);resize();
function tick(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;time+=dt;if(walking)travel+=dt*(.46/.62)/1.2;if(turn)angle+=dt*.3;
 actor.update({joe:{effectHeading:Math.PI/2,effectSpeed:walking?4:0,walkMeters:travel/.16,mode:'patrol'},time,reducedMotion:false},position,.16,dt);
 const mobile=innerWidth/innerHeight<.8?1.4:1;const target=portrait?1.43:.88,range=portrait?distance*.58:distance;camera.position.set(Math.sin(angle)*range*mobile,target+Math.sin(elevation)*range,-Math.cos(angle)*range*mobile);camera.lookAt(0,target,portrait?.20:-.12);renderer.render(scene,camera);
 const s=actor.stats();document.querySelector('#status').textContent=s.error?'Load failed: '+s.error:s.ready?'17 bones · 4 rotating wheels':'Loading model…';requestAnimationFrame(tick);}
window.joePreview={actor,renderer,camera};requestAnimationFrame(tick);
</script></html>
